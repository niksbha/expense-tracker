const parseD=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return dstr(d)};

const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];

const dayName=s=>{const t=today();if(s===t)return'Today';if(s===addDays(t,-1))return'Yesterday';

const fmtCache={};
function money(n,full){
  const cur=S.profile.currency;const frac=(full||Math.abs(n%1)>0.004)?2:0;const key=cur+frac;
  if(!fmtCache[key])fmtCache[key]=new Intl.NumberFormat(cur==='INR'?'en-IN':undefined,{style:'currency',currency:cur,minimumFractionDigits:frac,maximumFractionDigits:frac});
  return fmtCache[key].format(n);
}
function curSym(){try{return new Intl.NumberFormat(S.profile.currency==='INR'?'en-IN':undefined,{style:'currency',currency:S.profile.currency}).formatToParts(0).find(p=>p.type==='currency').value}catch(e){return''}}
